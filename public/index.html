<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0d18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pay">
<title>Pay</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="stylesheet" href="./app.css?v=0aab1d757d36">
</head>
<body class="view-list">

<div class="orb a" aria-hidden="true"></div>
<div class="orb b" aria-hidden="true"></div>
<div class="orb c" aria-hidden="true"></div>

<!-- The home screen. Every account, named, one tap away, nothing hidden. -->
<section id="accounts" class="accounts" aria-label="Accounts">
  <h1 class="atitle">Accounts</h1>
  <div class="grid" id="grid"></div>
</section>

<!-- The code. Reached by tapping an account, and left by the button top left. -->
<section id="codeview" class="codeview" aria-label="Payment code">
  <div class="bar">
    <button type="button" id="back" class="back">
      <svg viewBox="0 0 12 12" aria-hidden="true" focusable="false" class="chev">
        <path d="M7.6 1.6 3.2 6l4.4 4.4" fill="none" stroke="currentColor"
              stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Accounts
    </button>
  </div>

  <main class="stage">
    <h2 id="name" class="name">&nbsp;</h2>

    <div class="coinwrap">
      <button type="button" id="coinbtn" class="coinbtn">
        <canvas id="coin" class="coin" role="img" aria-label="Payment code"></canvas>
      </button>
    </div>

    <div class="tools">
      <p id="say" class="say" role="status" aria-live="polite"></p>
      <button type="button" id="plainbtn" class="pill" aria-pressed="false">Plain code</button>
    </div>
  </main>
</section>

<noscript>
  <p class="noscript">This page draws its codes on the device, so it needs JavaScript.</p>
</noscript>

<script src="./qrcode.js?v=0aab1d757d36"></script>
<script src="./qr-art.js?v=0aab1d757d36"></script>
<script src="./data.js?v=0aab1d757d36"></script>
<script src="./app.js?v=0aab1d757d36"></script>
</body>
</html>
