<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0d18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pay">
<title>Pay</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="stylesheet" href="./app.css?v=__BUILD__">
</head>
<body class="view-list">

<div class="sky on" id="sky1" aria-hidden="true"></div>
<div class="sky" id="sky2" aria-hidden="true"></div>

<!-- The home screen. Every account, named, one tap away, nothing hidden. -->
<section id="accounts" class="accounts" aria-label="Accounts">
  <div class="ahead">
    <h1 class="atitle">Accounts</h1>
    <!-- The one door to the edit surface. It is a plain link: /admin/ sits behind Cloudflare
         Access, which does the signing in; nothing on this page knows or asks who you are. -->
    <a class="signin" href="./admin/">Sign in</a>
  </div>
  <!-- THE RAILS FILTER ONE LIST, they do not split it into three.
       A rail is a property of an account, not a category of account: thirteen of fourteen are
       payable by both QR and transfer, and Instapay by all three. Three separate books would
       list nearly everything twice, and a landing page would add a tap to the common case for
       the sake of two doors that open onto one item each. The buttons are built by app.js so
       the counts cannot go stale against the data. -->
  <div class="rails" id="rails" role="group" aria-label="Payment method"></div>
  <div class="grid" id="grid"></div>
</section>

<!-- The code. Reached by tapping an account, and left by the button top left. -->
<section id="codeview" class="codeview" aria-label="Payment code">
  <div class="bar">
    <button type="button" id="back" class="back">
      <svg viewBox="0 0 12 12" aria-hidden="true" focusable="false" class="chev">
        <path d="M7.6 1.6 3.2 6l4.4 4.4" fill="none" stroke="currentColor"
              stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Accounts
    </button>
  </div>

  <main class="stage">
    <!-- No title. The provider's name is struck around the coin's rim, where it belongs on a
         coin, and repeating it in 28px above was saying the same thing twice. The coin's own
         aria-label still carries it, so nothing is lost to a screen reader. -->
    <div class="coinwrap">
      <!-- ONE FACE. There was a reverse carrying the account number, reached by turning the coin
           over, which meant copying the number required showing it first. "Copy account number"
           puts it on the clipboard without it ever being on screen, which left the reverse with
           nothing to do. -->
      <button type="button" id="coinbtn" class="coinbtn">
        <canvas id="coin" class="coin" role="img" aria-label="Payment code"></canvas>
      </button>
      <!-- Shown OVER the coin rather than in place of it. The coin box stays laid out, because
           the zoom measures it and an element inside a display:none view reports a zero rect,
           which cancels the animation silently. -->
      <div class="maint" id="maint" aria-hidden="true">
        <p class="maint-h">Under maintenance</p>
      </div>
    </div>

    <div class="tools">
      <p id="say" class="say" role="status" aria-live="polite"></p>
      <!-- One action per rail this account actually has, and nothing for a rail it lacks. The
           JomPAY button is hidden rather than disabled on the thirteen without a biller code:
           disabled would say "you could pay this way but not now", which is untrue. -->
      <div class="pills">
        <button type="button" id="copybtn" class="pill">Copy account number</button>
        <button type="button" id="jompaybtn" class="pill" hidden>Copy JomPAY Ref-1</button>
      </div>
    </div>
  </main>
</section>

<noscript>
  <p class="noscript">This page draws its codes on the device, so it needs JavaScript.</p>
</noscript>

<script src="./qrcode.js?v=__BUILD__"></script>
<!-- The traced marks, registering themselves on self.MARKS. Path data, so no image is fetched
     and the Content-Security-Policy stays `default-src 'none'` with no img-src at all. -->
<script src="./marks.js?v=__BUILD__"></script>
<script src="./qr-art.js?v=__BUILD__"></script>
<script src="./data.js?v=__BUILD__"></script>
<script src="./app.js?v=__BUILD__"></script>
</body>
</html>
