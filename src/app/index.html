<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0d18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pay">
<title>Pay</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="stylesheet" href="./app.css?v=__BUILD__">
</head>
<body>

<div class="orb a" aria-hidden="true"></div>
<div class="orb b" aria-hidden="true"></div>
<div class="orb c" aria-hidden="true"></div>

<main class="stage">
  <h1 class="namewrap">
    <button type="button" id="namebtn" class="namebtn" aria-haspopup="dialog" aria-expanded="false">
      <span id="name" class="name">&nbsp;</span>
      <svg class="chev" viewBox="0 0 12 8" aria-hidden="true" focusable="false">
        <path d="M1.4 1.6 6 6.2l4.6-4.6" fill="none" stroke="currentColor"
              stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </h1>

  <div class="coinwrap">
    <button type="button" id="coinbtn" class="coinbtn">
      <canvas id="coin" class="coin" role="img" aria-label="Payment code"></canvas>
    </button>
  </div>

  <div class="tools">
    <button type="button" id="plainbtn" class="pill" aria-pressed="false">Plain code</button>
    <p id="say" class="say" role="status" aria-live="polite"></p>
  </div>
</main>

<nav class="dots" id="dots" aria-label="Jump to an account"></nav>

<dialog id="sheet" class="sheet" aria-label="Choose an account">
  <div class="sheetin">
    <p class="sheettitle">Accounts</p>
    <div class="grid" id="grid"></div>
    <button type="button" id="sheetclose" class="pill wide">Close</button>
  </div>
</dialog>

<noscript>
  <p class="noscript">This page draws its codes on the device, so it needs JavaScript.</p>
</noscript>

<script src="./qrcode.js?v=__BUILD__"></script>
<script src="./qr-art.js?v=__BUILD__"></script>
<script src="./data.js?v=__BUILD__"></script>
<script src="./app.js?v=__BUILD__"></script>
</body>
</html>
